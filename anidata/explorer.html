<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ANIData - Data Explorer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="layout">

        <!-- Menu across the top. The link for this page has the "active" class so it is highlighted. -->
        <nav class="sidebar" aria-label="Main">
            <div class="brand">AniDATA</div>
            <ul>
                <li><a href="dash.html" class="nav-link">Overview</a></li>
                <li><a href="tags.html" class="nav-link">Tags</a></li>
                <li><a href="live.html" class="nav-link">Live</a></li>
                <li><a href="explorer.html" class="nav-link active">Explorer</a></li>
            </ul>
        </nav>

        <main class="main">

            <!-- Testing buttons, top right -->
            <div id="testButtons">
                <button id="disconnectButton">Disconnect</button>
            </div>

            <!-- Data Explorer -->
            <section id="explorer">
                <h1>Data Explorer</h1>

                <!-- The tick boxes are added by explorer.js. None ticked means all. -->
                <fieldset>
                    <legend>Knots</legend>
                    <div id="knotBoxes"></div>
                </fieldset>

                <fieldset>
                    <legend>Tags</legend>
                    <details>
                        <summary>Choose tags</summary>
                        <div id="tagBoxes"></div>
                    </details>
                </fieldset>

                <fieldset>
                    <legend>Dates</legend>
                    <label for="filterFrom">From</label>
                    <input type="date" id="filterFrom">

                    <label for="filterTo">To</label>
                    <input type="date" id="filterTo">
                </fieldset>

                <button id="clearButton">Clear filters</button>
                <button id="exportButton">Export CSV</button>

                <p id="explorerCount"></p>
                <p id="exportMessage"></p>

                <table>
                    <thead>
                        <tr>
                            <th>Seen at</th>
                            <th>Tag</th>
                            <th>MAC address</th>
                            <th>RSSI</th>
                            <th>Knot</th>
                            <th>Recorded at</th>
                            <th>Advertisement</th>
                            <th>ID</th>
                        </tr>
                    </thead>
                    <!-- The rows are added by explorer.js -->
                    <tbody id="explorerTable"></tbody>
                </table>
            </section>

        </main>
    </div>
    <!-- common.js has the shared functions, so it must load before this page's own script -->
    <script src="/static/common.js"></script>
    <script src="/static/explorer.js"></script>
</body>
</html>
