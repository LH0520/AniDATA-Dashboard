<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ANIData - Live Monitoring</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="layout">

        <nav class="sidebar" aria-label="Main">
            <div class="brand">AniDATA</div>
            <ul>
                <li><a href="dash.html" class="nav-link">Overview</a></li>
                <li><a href="tags.html" class="nav-link">Tags</a></li>
                <li><a href="live.html" class="nav-link">Live</a></li>
                <li><a href="explorer.html" class="nav-link">Explorer</a></li>
            </ul>
        </nav>

        <main class="main">

            <!-- Live Monitoring -->
            <section id="live">
                <div class="pageHeader">
                    <div>
                        <h1>Live Monitoring</h1>
                        <p id="liveStatus"></p>
                    </div>
                    <div id="testButtons">
                        <span id="connectionPill" hidden></span>
                        <button id="pauseButton" hidden>Pause</button>
                        <button id="disconnectButton">Disconnect</button>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Animal</th>
                            <th>Knot</th>
                            <th>Signal</th>
                            <th>Battery</th>
                        </tr>
                    </thead>
                    <tbody id="liveTable"></tbody>
                </table>
            </section>

        </main>
    </div>
    <script src="/static/common.js"></script>
    <script src="/static/live.js"></script>
</body>
</html>
